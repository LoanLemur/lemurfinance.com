<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Lemur Finance</title>
    <meta name="description" content="Contact Lemur Finance.">
    <meta property="og:title" content="Contact — Lemur Finance">
    <meta property="og:description" content="Contact Lemur Finance.">
    <meta property="og:image" content="https://lemurfinance.com/assets/og-image.png">
    <meta property="og:url" content="https://lemurfinance.com/contact.html">
    <meta property="og:type" content="website">
    <link rel="icon" href="assets/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700&display=swap" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="css/style.css">
    <noscript>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap">
        <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700&display=swap">
        <style>
            .reveal, .reveal-stagger > * { opacity: 1; transform: none; }
        </style>
    </noscript>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="container header__inner">
            <a href="/" class="header__logo">
                <img src="assets/logo.svg" alt="Lemur" class="header__logo-img">
            </a>
            <a href="contact.html" class="header__contact" aria-current="page">Contact</a>
        </div>
    </header>

    <!-- ===== CONTACT ===== -->
    <main>
        <section class="hero">
            <img src="assets/mark.svg" alt="" class="hero__mark" aria-hidden="true">
            <div class="container">
              <h1 class="hero__headline">Contact us</h1>
                <div class="hero__rule"></div>
                <p class="hero__subtext">For businesses evaluating Lemur. Rough estimates are fine throughout — we use this to model opportunity and tailor the program.</p>
            </div>
        </section>

        <section class="contact-form" aria-labelledby="contact-form-title">
          <div class="container">
            <iframe
              src="https://api.leadconnectorhq.com/widget/form/WRtL7OYIaipFH8AX5puF"
              style="width:100%;height:900px;border:none;border-radius:0"
              id="inline-WRtL7OYIaipFH8AX5puF"
              data-layout="{'id':'INLINE'}"
              data-trigger-type="alwaysShow"
              data-trigger-value=""
              data-activation-type="alwaysActivated"
              data-activation-value=""
              data-deactivation-type="neverDeactivate"
              data-deactivation-value=""
              title="Client Discovery & Intake">
            </iframe>
            <script src="https://link.msgsndr.com/js/form_embed.js"></script>
          </div>
        </section>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="footer">
        <img src="assets/tail.jpg" alt="" class="footer__mark" aria-hidden="true">
        <div class="container footer__inner">
            <span class="footer__copy">&copy; 2026 Lemur Finance, LLC</span>
            <div class="footer__links">
                <a href="terms.html" class="footer__link">Terms &amp; Conditions</a>
                <a href="privacy.html" class="footer__link">Privacy Policy</a>
            </div>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
