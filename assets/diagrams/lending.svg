<svg viewBox="0 0 520 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .label { font-family: 'Satoshi', system-ui, sans-serif; font-size: 10px; fill: #a0a0a8; text-transform: uppercase; letter-spacing: 0.1em; }
    .value { font-family: 'Sora', system-ui, sans-serif; font-size: 13px; fill: #1a1a1e; font-weight: 600; }
    .detail { font-family: 'Satoshi', system-ui, sans-serif; font-size: 11px; fill: #52525a; }
    .small { font-family: 'Satoshi', system-ui, sans-serif; font-size: 9px; fill: #a0a0a8; }
    .line { stroke: #e4e4e7; stroke-width: 1; }
    .box { fill: none; stroke: #e4e4e7; stroke-width: 1; rx: 2; }
  </style>

  <!-- Timeline header -->
  <text class="label" x="20" y="20">ACH Schedule — Synced to payroll</text>

  <!-- Timeline axis -->
  <line class="line" x1="20" y1="56" x2="500" y2="56"/>

  <!-- Payroll + ACH markers (same day) -->
  <g>
    <line stroke="#e4e4e7" x1="60" y1="48" x2="60" y2="64"/>
    <circle cx="60" cy="56" r="6" fill="#FFCC00"/>
    <text class="small" x="60" y="80" text-anchor="middle">Jan 15</text>
  </g>
  <g>
    <line stroke="#e4e4e7" x1="150" y1="48" x2="150" y2="64"/>
    <circle cx="150" cy="56" r="6" fill="#FFCC00"/>
    <text class="small" x="150" y="80" text-anchor="middle">Feb 1</text>
  </g>
  <g>
    <line stroke="#e4e4e7" x1="240" y1="48" x2="240" y2="64"/>
    <circle cx="240" cy="56" r="6" fill="#FFCC00"/>
    <text class="small" x="240" y="80" text-anchor="middle">Feb 15</text>
  </g>
  <g>
    <line stroke="#e4e4e7" x1="330" y1="48" x2="330" y2="64"/>
    <circle cx="330" cy="56" r="6" fill="#FFCC00"/>
    <text class="small" x="330" y="80" text-anchor="middle">Mar 1</text>
  </g>
  <g>
    <line stroke="#e4e4e7" x1="420" y1="48" x2="420" y2="64"/>
    <circle cx="420" cy="56" r="6" fill="#FFCC00"/>
    <text class="small" x="420" y="80" text-anchor="middle">Mar 15</text>
  </g>

  <!-- ACH amount lines -->
  <line stroke="#FFCC00" stroke-width="1" stroke-dasharray="3,3" x1="60" y1="62" x2="60" y2="96"/>
  <text class="detail" x="60" y="108" text-anchor="middle">$420</text>

  <line stroke="#FFCC00" stroke-width="1" stroke-dasharray="3,3" x1="150" y1="62" x2="150" y2="96"/>
  <text class="detail" x="150" y="108" text-anchor="middle">$420</text>

  <line stroke="#FFCC00" stroke-width="1" stroke-dasharray="3,3" x1="240" y1="62" x2="240" y2="96"/>
  <text class="detail" x="240" y="108" text-anchor="middle">$420</text>

  <line stroke="#FFCC00" stroke-width="1" stroke-dasharray="3,3" x1="330" y1="62" x2="330" y2="96"/>
  <text class="detail" x="330" y="108" text-anchor="middle">$420</text>

  <line stroke="#FFCC00" stroke-width="1" stroke-dasharray="3,3" x1="420" y1="62" x2="420" y2="96"/>
  <text class="detail" x="420" y="108" text-anchor="middle">$420</text>

  <!-- Legend -->
  <circle cx="30" cy="136" r="5" fill="#FFCC00"/>
  <text class="detail" x="44" y="140">Payroll day = ACH debit</text>

  <!-- Credit assessment box -->
  <rect class="box" x="20" y="164" width="236" height="140"/>
  <text class="label" x="36" y="186">Credit Assessment</text>
  <line class="line" x1="20" y1="194" x2="256" y2="194"/>

  <text class="detail" x="36" y="216">Employment verified</text>
  <rect x="210" y="206" width="32" height="16" rx="2" fill="#1a3a5c"/>
  <text font-family="Satoshi, sans-serif" font-size="9" fill="white" x="226" y="218" text-anchor="middle">Yes</text>

  <text class="detail" x="36" y="240">Income-to-debt</text>
  <text class="value" x="244" y="240" text-anchor="end">2.4x</text>

  <text class="detail" x="36" y="264">Payroll consistency</text>
  <text class="value" x="244" y="264" text-anchor="end">98%</text>

  <line class="line" x1="36" y1="276" x2="240" y2="276"/>
  <text class="small" x="138" y="294" text-anchor="middle">Goes beyond FICO</text>

  <!-- Portfolio box -->
  <rect class="box" x="280" y="164" width="220" height="140"/>
  <text class="label" x="296" y="186">Portfolio</text>
  <line class="line" x1="280" y1="194" x2="500" y2="194"/>

  <text class="detail" x="296" y="216">Active loans</text>
  <text class="value" x="488" y="216" text-anchor="end">142</text>

  <text class="detail" x="296" y="240">On-time rate</text>
  <text class="value" x="488" y="240" text-anchor="end">94.2%</text>

  <text class="detail" x="296" y="264">Avg. balance</text>
  <text class="value" x="488" y="264" text-anchor="end">$3,180</text>

  <line class="line" x1="296" y1="276" x2="484" y2="276"/>
  <text class="small" x="390" y="294" text-anchor="middle">Fully managed, no lending license needed</text>
</svg>
