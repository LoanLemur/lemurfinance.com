<svg viewBox="0 0 520 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .label { font-family: 'Satoshi', system-ui, sans-serif; font-size: 10px; fill: #a0a0a8; text-transform: uppercase; letter-spacing: 0.1em; }
    .value { font-family: 'Sora', system-ui, sans-serif; font-size: 13px; fill: #1a1a1e; font-weight: 600; }
    .value-sm { font-family: 'Sora', system-ui, sans-serif; font-size: 11px; fill: #1a1a1e; font-weight: 600; }
    .detail { font-family: 'Satoshi', system-ui, sans-serif; font-size: 11px; fill: #52525a; }
    .small { font-family: 'Satoshi', system-ui, sans-serif; font-size: 9px; fill: #a0a0a8; }
    .line { stroke: #e4e4e7; stroke-width: 1; }
    .line-accent { stroke: #1a3a5c; stroke-width: 1.5; }
    .box { fill: none; stroke: #e4e4e7; stroke-width: 1; rx: 2; }
    .box-accent { fill: none; stroke: #1a3a5c; stroke-width: 1.5; rx: 2; }
  </style>

  <!-- Flow label -->
  <text class="label" x="20" y="20">Patient &amp; Consumer Financing Flow</text>

  <!-- Offer wall -->
  <rect class="box-accent" x="20" y="36" width="240" height="248"/>
  <text class="label" x="140" y="58" text-anchor="middle">Offer Wall</text>
  <line class="line" x1="36" y1="66" x2="244" y2="66"/>

  <text class="detail" x="36" y="84">Treatment total</text>
  <text class="value" x="244" y="84" text-anchor="end">$4,200</text>

  <line class="line" x1="36" y1="96" x2="244" y2="96"/>

  <!-- Plan A -->
  <rect x="36" y="108" width="208" height="40" rx="3" fill="#fafaf9" stroke="#e4e4e7"/>
  <text class="value-sm" x="48" y="126">6 months</text>
  <text class="detail" x="48" y="140">0% APR</text>
  <text class="value" x="232" y="130" text-anchor="end">$700/mo</text>

  <!-- Plan B — selected -->
  <rect x="36" y="156" width="208" height="40" rx="3" fill="#FFCC00" fill-opacity="0.12" stroke="#FFCC00" stroke-width="1.5"/>
  <circle cx="48" cy="176" r="5" fill="#FFCC00"/>
  <text class="value-sm" x="60" y="174">12 months</text>
  <text class="detail" x="60" y="188">4.9% APR</text>
  <text class="value" x="232" y="180" text-anchor="end">$359/mo</text>

  <!-- Plan C -->
  <rect x="36" y="204" width="208" height="40" rx="3" fill="#fafaf9" stroke="#e4e4e7"/>
  <text class="value-sm" x="48" y="222">24 months</text>
  <text class="detail" x="48" y="236">7.9% APR</text>
  <text class="value" x="232" y="228" text-anchor="end">$190/mo</text>

  <text class="small" x="140" y="268" text-anchor="middle">Patient selects preferred plan at checkout</text>

  <!-- Arrow to merchant side -->
  <line class="line-accent" x1="260" y1="160" x2="292" y2="160"/>
  <polygon fill="#1a3a5c" points="292,156 300,160 292,164"/>

  <!-- Merchant side -->
  <rect class="box" x="304" y="36" width="196" height="140"/>
  <text class="label" x="402" y="58" text-anchor="middle">Merchant</text>
  <line class="line" x1="320" y1="66" x2="484" y2="66"/>

  <text class="detail" x="320" y="86">Payment received</text>
  <text class="value" x="484" y="86" text-anchor="end">$4,200</text>

  <text class="detail" x="320" y="108">Credit risk</text>
  <text class="value" x="484" y="108" text-anchor="end">None</text>

  <text class="detail" x="320" y="130">Funding</text>
  <text class="value" x="484" y="130" text-anchor="end">2 days</text>

  <line class="line" x1="320" y1="142" x2="484" y2="142"/>
  <rect x="320" y="150" width="12" height="12" rx="2" fill="#1a3a5c"/>
  <text class="detail" x="340" y="161">Paid in full, upfront</text>

  <!-- System of record sync -->
  <line class="line-accent" x1="402" y1="176" x2="402" y2="208"/>
  <polygon fill="#1a3a5c" points="398,208 402,216 406,208"/>

  <rect class="box" x="304" y="220" width="196" height="64"/>
  <text class="label" x="402" y="242" text-anchor="middle">System of Record</text>
  <line class="line" x1="320" y1="250" x2="484" y2="250"/>
  <text class="detail" x="320" y="268">Payment auto-recorded</text>
  <circle cx="476" cy="264" r="7" fill="none" stroke="#1a3a5c" stroke-width="1.5"/>
  <polyline points="472,264 475,267 480,261" stroke="#1a3a5c" stroke-width="1.5" fill="none"/>
</svg>
