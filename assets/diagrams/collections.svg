<svg viewBox="0 0 520 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .label { font-family: 'Satoshi', system-ui, sans-serif; font-size: 10px; fill: #a0a0a8; text-transform: uppercase; letter-spacing: 0.1em; }
    .value { font-family: 'Sora', system-ui, sans-serif; font-size: 13px; fill: #1a1a1e; font-weight: 600; }
    .detail { font-family: 'Satoshi', system-ui, sans-serif; font-size: 11px; fill: #52525a; }
    .msg { font-family: 'Satoshi', system-ui, sans-serif; font-size: 10px; }
    .small { font-family: 'Satoshi', system-ui, sans-serif; font-size: 9px; fill: #a0a0a8; }
    .line { stroke: #e4e4e7; stroke-width: 1; }
    .box { fill: none; stroke: #e4e4e7; stroke-width: 1; rx: 2; }
  </style>

  <!-- Header -->
  <text class="label" x="20" y="20">Automated Outreach — SMS</text>

  <!-- System message 1 -->
  <text class="small" x="20" y="44">Lemur AI · 9:02 AM</text>
  <rect x="20" y="50" width="310" height="44" rx="12" fill="#1a3a5c"/>
  <text class="msg" fill="#f0f0ee" x="34" y="68">Hi Sarah, your balance of $1,240 is 32 days</text>
  <text class="msg" fill="#f0f0ee" x="34" y="82">past due. We'd like to help you get current.</text>

  <!-- Customer reply 1 -->
  <text class="small" x="500" y="116" text-anchor="end">Sarah · 9:14 AM</text>
  <rect x="250" y="122" width="250" height="28" rx="12" fill="#f2f2f0" stroke="#e4e4e7"/>
  <text class="msg" fill="#52525a" x="264" y="140">I know, things have been tight. What can I do?</text>

  <!-- System message 2 — offers plan + link -->
  <text class="small" x="20" y="174">Lemur AI · 9:15 AM</text>
  <rect x="20" y="180" width="330" height="44" rx="12" fill="#1a3a5c"/>
  <text class="msg" fill="#f0f0ee" x="34" y="198">No problem. We can set up 6 payments of $207/mo.</text>
  <text class="msg" fill="#f0f0ee" x="34" y="212">Here's a secure link to add your payment method:</text>

  <!-- Payment link — attached to AI message -->
  <rect x="20" y="230" width="330" height="34" rx="8" fill="#FFCC00" fill-opacity="0.1" stroke="#FFCC00" stroke-width="1.5"/>
  <circle cx="40" cy="247" r="8" fill="#FFCC00" fill-opacity="0.25"/>
  <text font-family="Sora, sans-serif" font-size="9" font-weight="600" fill="#FFCC00" x="40" y="250" text-anchor="middle">↗</text>
  <text font-family="Satoshi, sans-serif" font-size="11" font-weight="500" fill="#1a3a5c" x="56" y="251">pay.lemurfinance.com/plan/a8xK2</text>

  <!-- Customer confirms -->
  <text class="small" x="500" y="288" text-anchor="end">Sarah · 9:22 AM</text>
  <rect x="320" y="294" width="180" height="28" rx="12" fill="#f2f2f0" stroke="#e4e4e7"/>
  <text class="msg" fill="#52525a" x="334" y="312">Done — just added my card. ✓</text>

  <!-- Divider -->
  <line class="line" x1="20" y1="346" x2="500" y2="346"/>

  <!-- Results — two boxes matching the other diagrams' style -->
  <rect x="20" y="358" width="236" height="52" rx="2" fill="none" stroke="#FFCC00" stroke-width="1.5"/>
  <text class="label" x="36" y="378">Plan Active</text>
  <text class="value" x="36" y="398">6 × $207/mo</text>
  <text class="detail" x="244" y="398" text-anchor="end">First: Feb 1</text>

  <rect class="box" x="280" y="358" width="220" height="52"/>
  <text class="label" x="296" y="378">Recovery Stats</text>
  <text class="detail" x="296" y="398">Contacted: 847</text>
  <text class="detail" x="408" y="398">Rate:</text>
  <text class="value" x="488" y="398" text-anchor="end">68%</text>
</svg>
